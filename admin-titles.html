<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称号图片上传 - NB频道</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 30px 16px; background: #f5f6f8; color: #222; }
        h1 { font-size: 1.4rem; }
        .token-box { display: flex; gap: 8px; margin: 14px 0; }
        .token-box input { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid #ccc; }
        button { border: none; border-radius: 10px; padding: 9px 18px; cursor: pointer; background: #00a1d6; color: #fff; font-size: 0.9rem; }
        button:disabled { opacity: 0.5; cursor: default; }
        .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eee; flex-wrap: wrap; }
        .row .name { width: 90px; font-weight: 600; }
        .row input[type=file] { flex: 1; min-width: 180px; font-size: 0.85rem; }
        .row .url { flex-basis: 100%; font-size: 0.75rem; color: #666; word-break: break-all; }
        .status { font-size: 0.8rem; color: #4caf50; }
        .status.err { color: #e74c3c; }
        .all-btn { margin: 16px 0; }
        #resultBox { margin-top: 14px; padding: 12px; background: #fff; border-radius: 10px; font-size: 0.8rem; white-space: pre-wrap; line-height: 1.8; display: none; }
    </style>
</head>
<body>
    <h1>🏅 称号图片上传（管理员）</h1>
    <p style="color:#666; font-size:0.85rem;">上传到 Supabase 桶 <code>images/titles/&lt;称号名&gt;.png</code>，同名覆盖。建议图片先压缩（每张 ≤100KB，宽度 ~1000px）。</p>

    <div class="token-box">
        <input type="password" id="adminToken" placeholder="管理员 Token（admin_sessions）">
        <button onclick="saveToken()">保存</button>
    </div>
    <div class="all-btn"><button id="uploadAllBtn" onclick="uploadAll()">🚀 全部上传（未选文件的跳过）</button></div>

    <div id="rows"></div>

    <button style="margin-top:14px;" onclick="copyUrls()">📋 复制全部链接</button>
    <div id="resultBox"></div>

    <script>
        const API_BASE = 'https://nbchannel.pythonanywhere.com';
        const NAMES = ['签到之神', '评论大师', '红包豪侠', '点赞大师', '霸道总裁', '化学狂人',
                       '作品大亨', '成就猎人', '人脉达人', '抽奖欧皇', '现金为王', '至尊皇冠'];

        function saveToken() {
            localStorage.setItem('title_admin_token', document.getElementById('adminToken').value.trim());
            alert('Token 已保存（仅存本浏览器）');
        }

        function buildRows() {
            const box = document.getElementById('rows');
            box.innerHTML = NAMES.map(n => `
                <div class="row">
                    <span class="name">${n}</span>
                    <input type="file" accept="image/*" data-name="${n}">
                    <span class="status" id="st_${n}"></span>
                    <div class="url" id="url_${n}"></div>
                </div>`).join('');
        }

        function getToken() {
            const t = document.getElementById('adminToken').value.trim() || localStorage.getItem('title_admin_token');
            if (!t) { alert('请先填写管理员 Token'); return null; }
            return t;
        }

        async function uploadOne(name, file) {
            const st = document.getElementById('st_' + name);
            const urlEl = document.getElementById('url_' + name);
            st.className = 'status';
            st.innerText = '⏳ 上传中...';
            const fd = new FormData();
            fd.append('title_name', name);
            fd.append('file', file);
            try {
                const resp = await fetch(API_BASE + '/upload-title', {
                    method: 'POST',
                    headers: { 'X-Admin-Token': getToken() },
                    body: fd
                });
                const result = await resp.json();
                if (!result.success) {
                    st.className = 'status err';
                    st.innerText = '❌ ' + (result.message || '失败');
                    return null;
                }
                st.className = 'status';
                st.innerText = '✅ 成功';
                urlEl.innerText = result.url;
                return result.url;
            } catch (e) {
                st.className = 'status err';
                st.innerText = '❌ 网络错误：' + e.message;
                return null;
            }
        }

        async function uploadAll() {
            if (!getToken()) return;
            const btn = document.getElementById('uploadAllBtn');
            btn.disabled = true;
            for (const name of NAMES) {
                const input = document.querySelector(`input[data-name="${name}"]`);
                if (input && input.files[0]) {
                    await uploadOne(name, input.files[0]);
                }
            }
            btn.disabled = false;
        }

        function copyUrls() {
            const lines = [];
            for (const name of NAMES) {
                const url = document.getElementById('url_' + name).innerText;
                if (url) lines.push(`${name}: ${url}`);
            }
            if (!lines.length) { alert('还没有上传成功的图片'); return; }
            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            box.innerText = lines.join('\n');
            navigator.clipboard && navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
        }

        buildRows();
    </script>
</body>
</html>
