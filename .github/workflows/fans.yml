name: Sync Bilibili Fans

# 每 30 分钟抓一次 B站粉丝数写入 fans.json(有变化才提交)。
# 首页(index-Beta.html)每 60s 静默轮询 fans.json,数字就地平滑更新,无需刷新。
# 若首次运行报 "Resource not accessible by integration" 权限错误,
# 请到 仓库 Settings → Actions → General → Workflow permissions 勾选 "Read and write permissions"。
on:
  schedule:
    - cron: '17,47 * * * *'   # 每 30 分钟,错开整点避免 GitHub 队列高峰
  workflow_dispatch:          # 也支持在 Actions 页手动触发

permissions:
  contents: write

concurrency:
  group: fans-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch follower count from Bilibili
        id: fetch
        env:
          UID: "3493259582114264"
        run: |
          json="$(curl -sS --max-time 20 \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' \
            -H 'Referer: https://www.bilibili.com/' \
            "https://api.bilibili.com/x/relation/stat?vmid=${UID}")"
          code="$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("code",-1))')"
          if [ "$code" != "0" ]; then
            echo "::error::bilibili api error code=$code resp=$json"
            exit 1
          fi
          followers="$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["follower"])')"
          echo "follower=$followers"
          echo "follower=$followers" >> "$GITHUB_OUTPUT"

      - name: Commit fans.json if changed
        env:
          FOLLOWER: ${{ steps.fetch.outputs.follower }}
        run: |
          prev=""
          if [ -f fans.json ]; then
            prev="$(python3 -c 'import json;print(json.load(open("fans.json")).get("follower",""))' 2>/dev/null || true)"
          fi
          if [ "$FOLLOWER" = "$prev" ]; then
            echo "no change (follower=$FOLLOWER), skip commit"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"follower":%s,"updated_at":"%s"}\n' "$FOLLOWER" "$ts" > fans.json
          git config user.name 'NB频道粉丝同步'
          git config user.email 'fans-sync@nb-channel.top'
          git add fans.json
          git commit -m "同步B站粉丝数: $FOLLOWER"
          git pull --rebase origin main
          git push origin main
          echo "pushed follower=$FOLLOWER"
