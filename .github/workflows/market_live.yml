name: Market Live Driver (fluctuate every 10s while running)

# 无人访问时维持"约每10秒波动一次"的节奏。
# 原理：GitHub Actions 定时最小粒度 1 分钟，但单个任务最长可运行 6 小时；
#       每天两个窗口（北京时间 8:00、14:00 启动，cron 为 UTC 的 0:00、6:00），
#       窗口内每 10 秒调用一次波动 RPC，直到 5 小时 59 分 30 秒后自行退出。
# 每个 tick 都是独立请求/独立事务，行锁即时释放 —— 不会像 pg_cron+pg_sleep
# 方案那样把锁攥在手里 60 秒导致访客请求超时。
# 波动函数内部有交易时段判断(8:00-20:00)与 8 秒节流，越界/重叠调用自动跳过，安全。
on:
  schedule:
    - cron: '0 0,6 * * *'   # UTC 0:00、6:00 = 北京时间 8:00、14:00
  workflow_dispatch:

jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - name: Fluctuate every 10 seconds
        run: |
          END=$((SECONDS + 21570))   # 5小时59分30秒，留30秒余量避免触碰6小时上限
          while [ $SECONDS -lt $END ]; do
            curl -s -X POST "https://pbaafgjkwdbwcmsikcmg.supabase.co/rest/v1/rpc/random_fluctuate_market_values" \
              -H "apikey: sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
              -H "Authorization: Bearer sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
              -H "Content-Type: application/json" \
              -d '{}'
            sleep 10
          done
          echo "本窗口结束（约13:59/19:59 北京时间），等待下一窗口"
