name: Market Sample (intraday snapshot every 5 min)

# 交易时段内（北京时间 8:00-19:55）每 5 分钟自动采集一次全市场快照，
# 保证每天 K 线数据完整（不依赖访客打开股票页面）。
# cron 表达式为 UTC 时间：*/5 0-11 * * * = 北京时间 8:00-19:55 每 5 分钟一次。
# 数据库侧 sample_market_snapshot() 会校验交易时段（8:00-20:00），非交易时段自动跳过。
on:
  schedule:
    - cron: '*/5 0-11 * * *'
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Sample market snapshot via Supabase RPC
        run: |
          curl -s -X POST "https://pbaafgjkwdbwcmsikcmg.supabase.co/rest/v1/rpc/sample_market_snapshot" \
            -H "apikey: sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
            -H "Authorization: Bearer sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "采样完成（北京时间 8:00-19:55，每5分钟一次）"
