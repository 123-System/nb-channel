name: Market Sample Backup (hourly)

# 备份采样：数据库自循环（pg_cron）是主力（交易时段15分钟/休市60分钟），
# 本工作流每小时补采一次作为双保险，并负责休市平线兜底。
# 私有仓库 Actions 免费额度 2000 分钟/月：本工作流约 24 次/天 × 20秒 ≈ 240分钟/月，
# 加上 auto-update 与 market_open，总用量约 300-400 分钟/月，余量充足。
# cron 为 UTC 时间：0 * * * * = 每小时整点。
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Sample market snapshot (backup)
        run: |
          curl -s -X POST "https://pbaafgjkwdbwcmsikcmg.supabase.co/rest/v1/rpc/sample_market_snapshot" \
            -H "apikey: sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
            -H "Authorization: Bearer sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "备份采样完成（每小时一次）"
