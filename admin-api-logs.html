<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 访问日志 - NB频道</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f0f2f5; margin: 0; padding: 20px;
    }
    .container { max-width: 1180px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 22px; }
    h1 { margin-top: 0; color: #00a1d6; font-size: 1.35rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    .top-bar a { color: #00a1d6; text-decoration: none; font-size: 0.9rem; margin-left: 14px; }
    .top-bar a:hover { text-decoration: underline; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; }
    .card .n { font-size: 1.6rem; font-weight: 700; color: #00a1d6; font-variant-numeric: tabular-nums; }
    .card .l { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
    .box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; }
    .box h3 { margin: 0 0 10px; font-size: 0.95rem; }
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.88rem; }
    .kv:last-child { border-bottom: none; }
    .kv span { color: #6c757d; word-break: break-all; }
    .kv b { font-variant-numeric: tabular-nums; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .filters input, .filters select {
        padding: 8px 12px; border: 1px solid #ddd; border-radius: 30px; font-size: 0.9rem; background: #fff;
    }
    .filters button, .actions button {
        border: none; border-radius: 30px; padding: 8px 18px; font-size: 0.9rem; cursor: pointer; background: #00a1d6; color: #fff;
    }
    .filters button:hover, .actions button:hover { filter: brightness(0.92); }
    .actions button.danger { background: #e74c3c; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; color: #6c757d; font-size: 0.78rem; letter-spacing: 0.5px; white-space: nowrap; }
    td { padding: 7px 10px; border-bottom: 1px solid #eef1f5; vertical-align: top; word-break: break-all; }
    td.ts { white-space: nowrap; color: #6c757d; font-variant-numeric: tabular-nums; }
    .st { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 0.76rem; font-weight: 700; }
    .st-200 { background: #e6f7e6; color: #1a7f37; }
    .st-429 { background: #ffe9e9; color: #c0392b; }
    .st-4 { background: #fff3d6; color: #b7791f; }
    .st-5 { background: #fde8e8; color: #b91c1c; }
    .wrap { overflow-x: auto; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); justify-content: center; align-items: center; z-index: 100; }
    .modal .modal-content { background: #fff; border-radius: 14px; padding: 26px; max-width: 340px; width: 90%; }
    .modal input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 30px; margin: 12px 0; font-size: 1rem; }
    .modal button { border: none; background: #00a1d6; color: #fff; border-radius: 30px; padding: 9px 28px; cursor: pointer; font-size: 0.95rem; }
    .err { color: #e74c3c; font-size: 0.88rem; margin-bottom: 8px; }
    .hint { font-size: 0.8rem; color: #8a94a6; margin: 6px 0 14px; }
</style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="top-bar">
        <h1>📊 API 访问日志</h1>
        <div>
            <a href="admin-reports125800gxh.html">举报管理后台</a>
            <a href="admin-announcement.html">公告管理</a>
        </div>
    </div>

    <div id="summaryArea">
        <div class="cards">
            <div class="card"><div class="n" id="sToday">-</div><div class="l">今日请求(北京时间)</div></div>
            <div class="card"><div class="n" id="s429">-</div><div class="l">429 限流拦截(累计)</div></div>
            <div class="card"><div class="n" id="sTotal">-</div><div class="l">库中日志总数</div></div>
            <div class="card"><div class="n" id="sLast" style="font-size:1.1rem; padding-top:6px;">-</div><div class="l">最近一条记录(北京时间)</div></div>
        </div>
        <div class="two-col">
            <div class="box"><h3>请求最多的端点</h3><div id="topEndpoints">加载中...</div></div>
            <div class="box"><h3>请求最多的 IP(疑似爬虫)</h3><div id="topIps">加载中...</div></div>
        </div>
    </div>

    <div class="filters">
        <input type="text" id="fEndpoint" placeholder="端点包含,如 /api/market" style="min-width:180px;">
        <input type="text" id="fIp" placeholder="IP 精确,如 1.2.3.4" style="min-width:150px;">
        <select id="fStatus"><option value="">全部状态</option><option value="200">200</option><option value="429">429</option><option value="401">401</option><option value="502">502</option></select>
        <select id="fLimit"><option value="100">100 条</option><option value="300" selected>300 条</option><option value="1000">1000 条</option></select>
        <button id="applyFilter">🔍 查询</button>
        <button id="refreshBtn" style="background:#6c757d;">🔄 刷新</button>
    </div>

    <div class="actions" style="margin-bottom:12px;">
        <span style="font-size:0.85rem; color:#8a94a6;">日志保留:默认 30 天,可手动清理更早数据</span>
        <button id="purgeBtn" class="danger" style="float:right;">🗑️ 清理 30 天前的日志</button>
    </div>

    <div class="wrap">
        <table>
            <thead><tr><th>时间(北京)</th><th>端点</th><th>方法</th><th>IP</th><th>状态</th><th>User-Agent(截断)</th></tr></thead>
            <tbody id="logBody"><tr><td colspan="6">加载中...</td></tr></tbody>
        </table>
    </div>
    <p class="hint">说明:日志由 PythonAnywhere 后端每 20 秒批量写入(表 api_logs);进程内存版统计见 <code>/api/stats</code>。本页为持久历史。</p>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>管理员登录</h3>
        <input type="password" id="adminPassword" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')document.getElementById('doLogin').click();">
        <div id="loginError" class="err"></div>
        <button id="doLogin">登录</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let adminToken = sessionStorage.getItem('admin_token') || '';
    function getToken() { return adminToken; }

    async function getClientIP() {
        const services = ['https://icanhazip.com', 'https://api.ipify.org?format=text'];
        for (const url of services) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const ip = await response.text();
                    return ip.trim();
                }
            } catch (e) { /* 尝试下一个 */ }
        }
        return 'unknown';
    }

    async function checkPassword(pwd) {
        const { data, error } = await supabaseClient.rpc('check_admin_password_plain', { input_pwd: pwd });
        if (error) throw new Error(error.message);
        if (!data) return false;
        const ip = await getClientIP();
        const sessionRes = await supabaseClient.rpc('admin_create_session', { p_pwd: pwd, p_ip: ip });
        if (sessionRes.error) throw new Error(sessionRes.error.message);
        if (!sessionRes.data || !sessionRes.data.success) {
            throw new Error((sessionRes.data && sessionRes.data.message) || '创建会话失败');
        }
        adminToken = sessionRes.data.token;
        sessionStorage.setItem('admin_token', adminToken);
        return true;
    }

    function showLogin() {
        const modal = document.getElementById('loginModal');
        modal.style.display = 'flex';
        document.getElementById('doLogin').onclick = async () => {
            const pwd = document.getElementById('adminPassword').value;
            const err = document.getElementById('loginError');
            try {
                const ok = await checkPassword(pwd);
                if (ok) {
                    modal.style.display = 'none';
                    loadAll();
                } else {
                    err.innerText = '密码错误';
                }
            } catch (e) {
                err.innerText = '登录失败: ' + e.message;
            }
        };
    }

    function statusBadge(s) {
        s = Number(s);
        const cls = s === 200 ? 'st-200' : (s === 429 ? 'st-429' : (s >= 500 ? 'st-5' : 'st-4'));
        return '<span class="st ' + cls + '">' + s + '</span>';
    }

    function renderKV(el, rows, unit) {
        if (!rows || !rows.length) { el.innerHTML = '<div class="kv"><span>暂无数据</span></div>'; return; }
        el.innerHTML = rows.map(function (r) {
            return '<div class="kv"><span>' + (r.ip || '(空)') + '</span><b>' + r.n + ' ' + (unit || '') + '</b></div>';
        }).join('');
    }

    async function loadSummary() {
        const { data, error } = await supabaseClient.rpc('admin_api_log_summary', { p_token: getToken() });
        if (error || !data || !data.ok) { document.getElementById('summaryArea').innerHTML = '<div class="err">加载汇总失败: ' + ((error && error.message) || (data && data.message) || '未知') + '</div>'; return; }
        document.getElementById('sToday').textContent = data.today;
        document.getElementById('s429').textContent = data.rate_limited;
        document.getElementById('sTotal').textContent = data.total;
        document.getElementById('sLast').textContent = data.last || '暂无';
        renderKV(document.getElementById('topEndpoints'), data.endpoints);
        renderKV(document.getElementById('topIps'), data.ips);
    }

    async function loadLogs() {
        const body = document.getElementById('logBody');
        body.innerHTML = '<tr><td colspan="6">加载中...</td></tr>';
        const { data, error } = await supabaseClient.rpc('admin_get_api_logs', {
            p_token: getToken(),
            p_limit: parseInt(document.getElementById('fLimit').value, 10) || 300,
            p_endpoint: document.getElementById('fEndpoint').value.trim() || null,
            p_ip: document.getElementById('fIp').value.trim() || null,
            p_status: document.getElementById('fStatus').value ? parseInt(document.getElementById('fStatus').value, 10) : null
        });
        if (error || !data || !data.ok) {
            body.innerHTML = '<tr><td colspan="6" class="err">查询失败: ' + ((error && error.message) || (data && data.message) || '未知') + '</td></tr>';
            return;
        }
        const rows = data.rows || [];
        if (!rows.length) { body.innerHTML = '<tr><td colspan="6">没有符合条件的记录</td></tr>'; return; }
        body.innerHTML = rows.map(function (r) {
            const ua = (r.ua || '').slice(0, 60);
            return '<tr>' +
                '<td class="ts">' + (r.ts || '') + '</td>' +
                '<td><b>' + (r.endpoint || '') + '</b></td>' +
                '<td>' + (r.method || '') + '</td>' +
                '<td>' + (r.ip || '') + '</td>' +
                '<td>' + statusBadge(r.status) + '</td>' +
                '<td style="color:#8a94a6;">' + ua + '</td></tr>';
        }).join('');
    }

    function loadAll() { loadSummary(); loadLogs(); }

    document.getElementById('applyFilter').onclick = loadLogs;
    document.getElementById('refreshBtn').onclick = loadAll;
    document.getElementById('purgeBtn').onclick = async () => {
        if (!confirm('确认删除 30 天前的全部 API 日志?此操作不可恢复')) return;
        const { data, error } = await supabaseClient.rpc('admin_api_logs_purge', { p_token: getToken(), p_keep_days: 30 });
        if (error || !data || !data.ok) { alert('清理失败: ' + ((error && error.message) || (data && data.message) || '未知')); return; }
        alert('已删除 ' + data.deleted + ' 条旧日志');
        loadAll();
    };

    // 启动:校验 sessionStorage 里的 token 是否仍有效
    (async function () {
        if (adminToken) {
            const { data: valid } = await supabaseClient.rpc('admin_check_session', { p_token: adminToken });
            if (valid) { loadAll(); return; }
            adminToken = '';
            sessionStorage.removeItem('admin_token');
        }
        showLogin();
    })();
</script>
</body>
</html>
