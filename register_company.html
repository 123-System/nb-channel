    <script id="uiBootGuard">
(function () {
    try {
        // 经典模式(可选):localStorage nb_classic=1 时加 classic 类(第一帧前生效,零闪跳)
        var m = localStorage.getItem('nb_ui_mode');
        if (m === 'classic' || (m !== 'beta' && localStorage.getItem('nb_classic') === '1')) document.documentElement.classList.add('classic');
        else if (m === 'beta') document.documentElement.classList.add('beta');
        // 纯新UI:隐藏 body,等待 ui-nav.js 注入完成后解除(首帧即完整新UI,零闪跳)
        document.documentElement.classList.add('ui-boot-new');
        var st = document.createElement('style');
        st.id = 'uiBootHide';
        st.textContent = 'html.ui-boot-new body{visibility:hidden}';
        document.head.appendChild(st);
        setTimeout(function () {
            document.documentElement.classList.remove('ui-boot-new');
            var s = document.getElementById('uiBootHide');
            if (s) s.remove();
        }, 3500);
    } catch (e) {}
})();
</script><script src="js/common.js?v=20260828"></script>
    <script src="js/ui-nav.js?v=20260838"></script>
    <style>
        body {
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-card {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: var(--status-border);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }
        input, .readonly-field {
            width: 100%;
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }
        .readonly-field {
            background: var(--count-bg);
            cursor: not-allowed;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            background: var(--nav-btn-hover-bg);
            color: white;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            filter: brightness(0.9);
        }
        .error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--status-border);
            text-decoration: none;
        }

</head>
<body>
<script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})();</script>
<div class="register-card">
    <h2>🏢 注册虚拟公司</h2>
    <div id="formContainer">
        <div class="form-group">
            <label>公司名称</label>
            <input type="text" id="companyName" placeholder="例如：NB科技（1-20字）" maxlength="20">
        </div>
        <div class="form-group">
            <label>公司所有人</label>
            <div class="readonly-field" id="ownerName">加载中...</div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="needVerify">
            <label for="needVerify">去认证你的虚拟公司（审核通过后评论区内会显示已认证）</label>
        </div>
        <div class="error" id="errorMsg"></div>
        <button id="submitBtn">提交注册</button>
        <div class="back-link">
            <a href="Virtual stock.html">← 返回股票页面</a>
        </div>
    </div>
</div>

<div style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--count-text); line-height:2.1;">

<div class="fixed-buttons">
    <button class="theme-toggle-fixed" id="themeToggleFixed" onclick="toggleTheme()">🌙</button>
    <div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function loadCurrentUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) {
            window.location.href = uiHref('login.html?redirect=') + encodeURIComponent(window.location.href);
            return;
        }
        try {
            const user = JSON.parse(stored);
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('id, username')
                .eq('id', user.id)
                .maybeSingle();
            if (error || !data) {
                localStorage.removeItem('nb_user');
                window.location.href = uiHref('login.html?redirect=') + encodeURIComponent(window.location.href);
                return;
            }
            currentUser = data;
            document.getElementById('ownerName').innerText = currentUser.username;
        } catch(e) {
            console.error(e);
            window.location.href = uiHref('login.html');
        }
    }

    async function registerCompany() {
        const companyName = document.getElementById('companyName').value.trim();
        const needVerify = document.getElementById('needVerify').checked;
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = '';

        if (!companyName) {
            errorDiv.innerText = '请填写公司名称';
            return;
        }
        if (companyName.length > 20) {
            errorDiv.innerText = '公司名称不能超过20字';
            return;
        }

        // 调用 RPC register_company
        const { data, error } = await supabaseClient.rpc('register_company', {
            p_user_id: currentUser.id,
            p_company_name: companyName,
            p_need_verify: needVerify
        });
        if (error) {
            errorDiv.innerText = '注册失败：' + error.message;
            return;
        }
        if (!data.success) {
            errorDiv.innerText = data.message;
            return;
        }
        if (data.need_verify) {
            alert('公司注册申请已提交，请等待管理员审核。\n审核通过后您将获得虚拟公司并开始股票交易。');
        } else {
            alert('公司注册成功！');
        }
        window.location.href = uiHref('Virtual stock.html');
    }

    loadCurrentUser();
    document.getElementById('submitBtn').addEventListener('click', registerCompany);
</script>
</body>
</html>
