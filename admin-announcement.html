<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理 - NB频道</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 { margin-top: 0; color: #00a1d6; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-bar a {
            color: #00a1d6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .top-bar a:hover { text-decoration: underline; }
        .session-info {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
        }
        textarea:focus { outline: 2px solid #00a1d6; border-color: #00a1d6; }
        .char-count { text-align: right; font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
        .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        button {
            border: none;
            border-radius: 30px;
            padding: 10px 26px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-save { background: #00a1d6; color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-ghost { background: #e9ecef; color: #333; }
        button:hover { filter: brightness(0.92); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .preview-box {
            margin-top: 20px;
            background: #fff8e6;
            border: 1px solid #ffd591;
            border-left: 4px solid #ff9800;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-line;
            word-break: break-word;
        }
        .preview-title { font-size: 0.85rem; color: #6c757d; margin-bottom: 6px; }
        .preview-empty { color: #aaa; }
        .tip {
            background: #e8f4fd;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #0b5e8a;
            margin-bottom: 18px;
        }
        #statusMsg {
            margin-top: 12px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        #statusMsg.ok { color: #27ae60; }
        #statusMsg.err { color: #e74c3c; }
        /* 登录弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin: 0 0 16px 0; color: #333; }
        .modal-content input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .modal-content input:focus { outline: 2px solid #00a1d6; border-color: #00a1d6; }
        .modal-content button {
            width: 100%;
            background: #00a1d6;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        .modal-content button:hover { filter: brightness(0.92); }
        #loginError { color: #e74c3c; font-size: 0.85rem; margin: 8px 0; min-height: 18px; }
    </style>
</head>
<body>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 管理员登录</h3>
        <input type="password" id="adminPassword" placeholder="请输入管理密码" autocomplete="off">
        <div id="loginError"></div>
        <button id="doLogin">登录</button>
    </div>
</div>

<div class="container" id="mainPanel" style="display:none;">
    <div class="top-bar">
        <h1>📢 公告管理</h1>
        <div>
            <a href="admin-reports125800gxh.html">举报管理后台 →</a>
        </div>
    </div>

    <div class="session-info">当前会话：<span id="sessionState">-</span> &nbsp; <button class="btn-ghost" id="logoutBtn" style="padding:4px 14px; font-size:0.8rem;">退出登录</button></div>

    <div class="tip">💡 公告会显示在 <strong>首页</strong> 和 <strong>评论区</strong> 顶部（黄色横条）。留空保存 = 清除公告。</div>

    <div class="form-group">
        <label for="announcementText">公告内容</label>
        <textarea id="announcementText" placeholder="在这里输入公告内容，支持换行……"></textarea>
        <div class="char-count"><span id="charCount">0</span> / 2000 字</div>
    </div>

    <div class="btn-row">
        <button class="btn-save" id="saveBtn">💾 保存公告</button>
        <button class="btn-clear" id="clearBtn">🗑️ 清除公告</button>
        <button class="btn-ghost" id="reloadBtn">🔄 重新载入</button>
    </div>
    <div id="statusMsg"></div>

    <div class="preview-box">
        <div class="preview-title">👀 前台预览（首页 / 评论区顶部效果）</div>
        <div id="previewContent" class="preview-empty">（暂无公告）</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let adminToken = sessionStorage.getItem('admin_token') || '';
    const MAX_LEN = 2000;

    function getToken() { return adminToken; }

    function setStatus(msg, ok) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.className = ok ? 'ok' : 'err';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // 转义后把 http(s) 链接变成可点击的超链接
    function linkify(str) {
        if (!str) return '';
        return str.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#00a1d6; text-decoration:underline;">$1</a>');
    }

    function renderPreview() {
        const text = document.getElementById('announcementText').value;
        const preview = document.getElementById('previewContent');
        if (!text.trim()) {
            preview.innerHTML = '<span class="preview-empty">（暂无公告）</span>';
        } else {
            preview.innerHTML = '📢 <strong>公告：</strong>' + linkify(escapeHtml(text));
        }
        document.getElementById('charCount').innerText = text.length;
    }

    async function getClientIP() {
        const services = [
            'https://icanhazip.com',
            'https://api.ipify.org?format=text'
        ];
        for (const url of services) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const ip = await response.text();
                    return ip.trim();
                }
            } catch (e) { /* 尝试下一个 */ }
        }
        return 'unknown';
    }

    async function checkPassword(pwd) {
        const { data, error } = await supabaseClient.rpc('check_admin_password_plain', { input_pwd: pwd });
        if (error) throw new Error(error.message);
        if (!data) return false;
        const ip = await getClientIP();
        const sessionRes = await supabaseClient.rpc('admin_create_session', { p_pwd: pwd, p_ip: ip });
        if (sessionRes.error) throw new Error(sessionRes.error.message);
        if (!sessionRes.data || !sessionRes.data.success) {
            throw new Error((sessionRes.data && sessionRes.data.message) || '创建会话失败');
        }
        adminToken = sessionRes.data.token;
        sessionStorage.setItem('admin_token', adminToken);
        return true;
    }

    async function loadAnnouncement() {
        try {
            const { data, error } = await supabaseClient
                .from('admin_config')
                .select('value')
                .eq('key', 'announcement')
                .maybeSingle();
            if (error) throw error;
            document.getElementById('announcementText').value = (data && data.value) || '';
            renderPreview();
        } catch (err) {
            setStatus('读取当前公告失败：' + err.message, false);
        }
    }

    async function saveAnnouncement(clear) {
        const text = clear ? '' : document.getElementById('announcementText').value;
        if (!clear && text.length > MAX_LEN) {
            setStatus(`内容太长（${text.length} 字），最多 ${MAX_LEN} 字`, false);
            return;
        }
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        saveBtn.disabled = true;
        clearBtn.disabled = true;
        try {
            const { data, error } = await supabaseClient.rpc('admin_update_announcement', {
                p_token: getToken(),
                p_text: text
            });
            if (error) throw error;
            if (!data || !data.success) {
                throw new Error((data && data.message) || '保存失败');
            }
            setStatus('✅ ' + data.message, true);
            if (clear) document.getElementById('announcementText').value = '';
            renderPreview();
        } catch (err) {
            setStatus('保存失败：' + err.message + (err.message && err.message.includes('过期') ? '' : ''), false);
            if (err.message && (err.message.includes('过期') || err.message.includes('无效'))) {
                setTimeout(() => { logout(); }, 1200);
            }
        } finally {
            saveBtn.disabled = false;
            clearBtn.disabled = false;
        }
    }

    function logout() {
        adminToken = '';
        sessionStorage.removeItem('admin_token');
        document.getElementById('mainPanel').style.display = 'none';
        showLoginModal();
    }

    function showLoginModal() {
        const modal = document.getElementById('loginModal');
        modal.style.display = 'flex';
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginError').innerText = '';
        document.getElementById('adminPassword').focus();
        document.getElementById('doLogin').onclick = async () => {
            const pwd = document.getElementById('adminPassword').value;
            if (!pwd) { document.getElementById('loginError').innerText = '请输入密码'; return; }
            document.getElementById('doLogin').disabled = true;
            try {
                const ok = await checkPassword(pwd);
                if (ok) {
                    modal.style.display = 'none';
                    initAdminPage();
                } else {
                    document.getElementById('loginError').innerText = '密码错误';
                }
            } catch (err) {
                document.getElementById('loginError').innerText = err.message;
            } finally {
                document.getElementById('doLogin').disabled = false;
            }
        };
        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('doLogin').click();
        });
    }

    async function initAdminPage() {
        document.getElementById('mainPanel').style.display = 'block';
        document.getElementById('sessionState').innerText = '已登录（30 分钟有效）';
        setStatus('', true);
        await loadAnnouncement();
    }

    // ==================== 启动 ====================
    document.getElementById('saveBtn').onclick = () => saveAnnouncement(false);
    document.getElementById('clearBtn').onclick = () => saveAnnouncement(true);
    document.getElementById('reloadBtn').onclick = loadAnnouncement;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('announcementText').addEventListener('input', renderPreview);

    (async () => {
        if (!getToken()) {
            showLoginModal();
            return;
        }
        try {
            const { data: valid } = await supabaseClient.rpc('admin_check_session', { p_token: getToken() });
            if (valid) {
                await initAdminPage();
            } else {
                sessionStorage.removeItem('admin_token');
                showLoginModal();
            }
        } catch (e) {
            showLoginModal();
        }
    })();
</script>
</body>
</html>
