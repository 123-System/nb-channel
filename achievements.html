    <script id="uiBootGuard">
(function () {
    try {
        // 经典模式(可选):localStorage nb_classic=1 时加 classic 类(第一帧前生效,零闪跳)
        var m = localStorage.getItem('nb_ui_mode');
        if (m === 'classic' || (m !== 'beta' && localStorage.getItem('nb_classic') === '1')) document.documentElement.classList.add('classic');
        else if (m === 'beta') document.documentElement.classList.add('beta');
        // 纯新UI:隐藏 body,等待 ui-nav.js 注入完成后解除(首帧即完整新UI,零闪跳)
        document.documentElement.classList.add('ui-boot-new');
        var st = document.createElement('style');
        st.id = 'uiBootHide';
        st.textContent = 'html.ui-boot-new body{visibility:hidden}';
        document.head.appendChild(st);
        setTimeout(function () {
            document.documentElement.classList.remove('ui-boot-new');
            var s = document.getElementById('uiBootHide');
            if (s) s.remove();
        }, 3500);
    } catch (e) {}
})();
</script><script src="js/common.js?v=20260845"></script>
    <script src="js/ui-nav.js?v=20260847"></script>
    <style>
        body {
            padding: 40px 20px;
            background: var(--bg-color);
        }
        .ach-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin: 0 0 10px 0;
            color: var(--status-border);
        }
        .sub-title {
            text-align: center;
            color: var(--count-text);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .top-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .top-actions a, .top-actions button {
            background: var(--nav-btn-bg);
            color: var(--nav-btn-text);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .top-actions a:hover, .top-actions button:hover {
            background: var(--nav-btn-hover-bg);
            color: white;
        }
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: var(--count-bg);
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--status-border);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--count-text);
            margin-top: 4px;
        }
        .ach-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .ach-card {
            background: var(--count-bg);
            border: 2px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            position: relative;
            transition: 0.2s;
        }
        .ach-card.unlocked {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,152,0,0.08));
        }
        .ach-card .icon {
            font-size: 2.2rem;
            line-height: 1;
            margin-bottom: 8px;
        }
        .ach-card.locked .icon {
            filter: grayscale(1);
            opacity: 0.45;
        }
        .ach-card .name {
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }
        .ach-card .desc {
            font-size: 0.78rem;
            color: var(--count-text);
            min-height: 32px;
            margin-bottom: 8px;
        }
        .ach-card .reward {
            display: inline-block;
            background: rgba(255,152,0,0.15);
            color: #ff9800;
            font-weight: 700;
            font-size: 0.82rem;
            border-radius: 20px;
            padding: 3px 12px;
        }
        .ach-card .time {
            font-size: 0.72rem;
            color: var(--count-text);
            margin-top: 8px;
        }
        .ach-card.locked {
            opacity: 0.85;
        }
        .login-tip {
            text-align: center;
            padding: 50px 0;
        }
        .login-tip p { color: var(--count-text); margin-bottom: 20px; }
        .login-tip a {
            background: var(--nav-btn-hover-bg);
            color: white;
            border-radius: 30px;
            padding: 10px 30px;
            text-decoration: none;
            display: inline-block;
        }
        .loading {
            text-align: center;
            color: var(--count-text);
            padding: 40px 0;
        }
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: #333;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            max-width: 90vw;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})();</script>
<div class="ach-container">
    <h1>🏆 我的成就</h1>
    <p class="sub-title">完成挑战解锁徽章，奖励只发一次</p>

    <div class="top-actions">
        <a href="index.html">🏠 返回首页</a>
        <a href="profile.html">👤 个人中心</a>
        <button id="refreshBtn">🔄 刷新</button>
    </div>

    <div id="content">
        <div class="loading">加载中...</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--count-text); line-height:2.1;">

<div class="fixed-buttons">

    <div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) return null;
        try { return JSON.parse(stored); } catch (e) { return null; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function formatTime(ts) {
        try {
            return new Date(ts).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
        } catch (e) {
            return new Date(ts).toLocaleString();
        }
    }

    let toastTimer = null;
    function showToast(text) {
        const t = document.getElementById('toast');
        t.innerHTML = text;
        t.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.style.display = 'none'; }, 6000);
    }

    async function loadAchievements() {
        const content = document.getElementById('content');
        const user = getUser();
        if (!user) {
            content.innerHTML = `
                <div class="login-tip">
                    <p>🔒 请先登录后再查看成就</p>
                    <a href="login.html">去登录</a>
                </div>`;
            return;
        }
        content.innerHTML = '<div class="loading">加载中...</div>';
        try {
            // 先检查：新达成条件自动发奖（幂等，重复调用不会重复发）
            const { data: check, error: checkErr } = await supabaseClient.rpc('check_achievements', { p_user_id: user.id });
            if (checkErr) throw checkErr;
            if (check && check.new_count > 0) {
                const list = (check.new || []).map(a => `${a.icon} ${a.name} +${a.reward} NB`).join('<br>');
                showToast(`🎉 解锁成就！<br>${list}<br><span style="font-size:0.85rem;">共获得 ${check.reward_total} NB币</span>`);
            }

            const { data, error } = await supabaseClient.rpc('get_my_achievements', { p_user_id: user.id });
            if (error) throw error;
            const list = data || [];

            const unlockedCount = list.filter(a => a.unlocked).length;
            let totalReward = 0;
            for (const a of list) {
                if (a.unlocked) totalReward += (a.reward || 0);
            }

            let html = `
                <div class="stats-row">
                    <div class="stat-card"><div class="num">${unlockedCount}/${list.length}</div><div class="label">已解锁成就</div></div>
                    <div class="stat-card"><div class="num" style="color:#ff9800;">${totalReward}</div><div class="label">累计奖励 (NB)</div></div>
                    <div class="stat-card"><div class="num" style="color:#4caf50;">${list.length - unlockedCount}</div><div class="label">待解锁</div></div>
                </div>
                <div class="ach-grid">`;

            for (const a of list) {
                const cls = a.unlocked ? 'unlocked' : 'locked';
                const timeHtml = a.unlocked
                    ? `<div class="time">✅ ${formatTime(a.claimed_at)} 解锁</div>`
                    : '<div class="time">🔒 未解锁</div>';
                html += `
                    <div class="ach-card ${cls}">
                        <div class="icon">${escapeHtml(a.icon)}</div>
                        <div class="name">${escapeHtml(a.name)}</div>
                        <div class="desc">${escapeHtml(a.description)}</div>
                        <span class="reward">+${a.reward} NB</span>
                        ${timeHtml}
                    </div>`;
            }

            html += '</div>';
            content.innerHTML = html;
        } catch (err) {
            console.error(err);
            content.innerHTML = `<div class="loading">加载失败：${escapeHtml(err.message)}，请刷新重试</div>`;
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadAchievements);
    loadAchievements();
</script>
</body>
