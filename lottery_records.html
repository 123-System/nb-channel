    <link rel="stylesheet" href="css/classic.css">

    <script id="uiBootGuard">
(function () {
    try {
        // 经典模式(可选):localStorage nb_classic=1 时加 classic 类(第一帧前生效,零闪跳)
        var m = localStorage.getItem('nb_ui_mode');
        if (m === 'classic' || (m !== 'beta' && localStorage.getItem('nb_classic') === '1')) document.documentElement.classList.add('classic');
        else if (m === 'beta') document.documentElement.classList.add('beta');
        // 纯新UI:隐藏 body,等待 ui-nav.js 注入完成后解除(首帧即完整新UI,零闪跳)
        document.documentElement.classList.add('ui-boot-new');
        var st = document.createElement('style');
        st.id = 'uiBootHide';
        st.textContent = 'html.ui-boot-new body{visibility:hidden}';
        document.head.appendChild(st);
        setTimeout(function () {
            document.documentElement.classList.remove('ui-boot-new');
            var s = document.getElementById('uiBootHide');
            if (s) s.remove();
        }, 3500);
    } catch (e) {}
})();
</script><script src="js/common.js?v=20260828"></script>
    <script src="js/ui-nav.js?v=20260838"></script>
    <style>
        body {
            padding: 40px 20px;
            background: var(--bg-color);
        }
        .records-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin: 0 0 10px 0;
            color: var(--status-border);
        }
        .sub-title {
            text-align: center;
            color: var(--count-text);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .top-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .top-actions a, .top-actions button {
            background: var(--nav-btn-bg);
            color: var(--nav-btn-text);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .top-actions a:hover, .top-actions button:hover {
            background: var(--nav-btn-hover-bg);
            color: white;
        }
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: var(--count-bg);
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--status-border);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--count-text);
            margin-top: 4px;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.95rem;
            gap: 10px;
            flex-wrap: wrap;
        }
        .record-item:last-child { border-bottom: none; }
        .record-result { font-weight: 600; }
        .record-result.win { color: #ff9800; }
        .record-result.none { color: var(--count-text); }
        .record-time { color: var(--count-text); font-size: 0.8rem; }
        .record-amount { font-weight: 700; color: var(--status-border); }
        .empty-tip {
            text-align: center;
            color: var(--count-text);
            padding: 40px 0;
            font-size: 0.95rem;
        }
        .login-tip {
            text-align: center;
            padding: 50px 0;
        }
        .login-tip p { color: var(--count-text); margin-bottom: 20px; }
        .login-tip a {
            background: var(--nav-btn-hover-bg);
            color: white;
            border-radius: 30px;
            padding: 10px 30px;
            text-decoration: none;
            display: inline-block;
        }
        .loading {
            text-align: center;
            color: var(--count-text);
            padding: 40px 0;
        }
    </style>
</head>
<body>
<script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})();</script>
<div class="records-container">
    <h1>🎰 我的抽奖记录</h1>
    <p class="sub-title">幸运转盘 · 每次消耗 50 NB币</p>

    <div class="top-actions">
        <a href="index.html">🏠 返回首页</a>
        <a href="index.html#lotteryModal">🎡 去抽奖</a>
        <button id="refreshBtn">🔄 刷新</button>
    </div>

    <div id="content">
        <div class="loading">加载中...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) return null;
        try { return JSON.parse(stored); } catch (e) { return null; }
    }

    function formatTime(ts) {
        try {
            return new Date(ts).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
        } catch (e) {
            return new Date(ts).toLocaleString();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    async function loadRecords() {
        const content = document.getElementById('content');
        const user = getUser();
        if (!user) {
            content.innerHTML = `
                <div class="login-tip">
                    <p>🔒 请先登录后再查看抽奖记录</p>
                    <a href="login.html">去登录</a>
                </div>`;
            return;
        }
        content.innerHTML = '<div class="loading">加载中...</div>';
        try {
            const { data, error } = await supabaseClient.rpc('get_my_lottery_records', { p_user_id: user.id });
            if (error) throw error;
            const records = data || [];

            let wins = 0, totalWin = 0;
            for (const r of records) {
                if (r.result === 'win') { wins++; totalWin += (r.amount || 0); }
            }
            const cost = records.length * 50;
            const net = totalWin - cost;

            let html = `
                <div class="stats-row">
                    <div class="stat-card"><div class="num">${records.length}</div><div class="label">总抽奖次数</div></div>
                    <div class="stat-card"><div class="num" style="color:#ff9800;">${wins}</div><div class="label">中奖次数</div></div>
                    <div class="stat-card"><div class="num">${totalWin}</div><div class="label">中奖总额 (NB)</div></div>
                    <div class="stat-card"><div class="num" style="color:${net >= 0 ? 'var(--status-border)' : '#ff6b6b'};">${net >= 0 ? '+' : ''}${net}</div><div class="label">净收益 (NB)</div></div>
                </div>`;

            if (!records.length) {
                html += '<div class="empty-tip">还没有抽过奖，快去试试手气吧～ 🎡</div>';
            } else {
                html += '<div>';
                for (const r of records) {
                    const isWin = r.result === 'win';
                    html += `
                        <div class="record-item">
                            <span class="record-result ${isWin ? 'win' : 'none'}">${isWin ? '🎉 中奖' : '😅 谢谢惠顾'}</span>
                            <span class="record-amount">${isWin ? '+' + r.amount + ' NB' : '0 NB'}</span>
                            <span class="record-time">${formatTime(r.created_at)}</span>
                        </div>`;
                }
                html += '</div>';
            }
            content.innerHTML = html;
        } catch (err) {
            content.innerHTML = `<div class="empty-tip">加载失败：${escapeHtml(err.message || err)}<br><br>请稍后重试</div>`;
        }
    }

    document.getElementById('refreshBtn').onclick = loadRecords;
    initTheme();
    loadRecords();
</script>
