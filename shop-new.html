    <style>
        body { padding: 40px 20px; background: var(--bg-color); }
        .shop-container {
            max-width: 900px; margin: 0 auto;
            background: var(--card-bg); border-radius: 32px; padding: 30px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin: 0 0 6px; color: var(--status-border); }
        .page-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
        .page-head h1 { margin: 0; text-align: center; }
        .page-head .balance-chip { justify-self: start; }
        .page-head .ph-spacer { justify-self: end; }
        .balance-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--count-bg); border: 1px solid var(--card-border);
            border-radius: 30px; padding: 6px 16px; font-size: 0.9rem;
            color: var(--text-color); font-weight: 600; white-space: nowrap;
        }
        .balance-chip .bc-num { color: #ff9800; font-weight: 800; }
        .sub-title { text-align: center; color: var(--count-text); font-size: 0.9rem; margin-bottom: 22px; }
        .top-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
        .top-actions a, .top-actions button {
            background: var(--nav-btn-bg); color: var(--nav-btn-text);
            border: 1px solid var(--card-border); border-radius: 30px;
            padding: 8px 18px; font-size: 0.9rem; cursor: pointer; text-decoration: none;
        }
        .top-actions button:hover { background: var(--nav-btn-hover-bg); color: white; }
        .section { margin-bottom: 28px; }
        .section-title { font-size: 1.05rem; font-weight: 700; color: var(--status-border); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
        .shop-card {
            background: var(--count-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px;
        }
        .shop-card .sc-icon { font-size: 2rem; }
        .shop-card .sc-name { font-weight: 700; color: var(--text-color); font-size: 1rem; }
        .shop-card .sc-desc { font-size: 0.8rem; color: var(--count-text); line-height: 1.6; flex: 1; }
        .shop-card .sc-price { font-weight: 800; color: #ff9800; font-size: 1.05rem; }
        .shop-card .sc-badge {
            display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-right: 4px;
        }
        .bd-decoration { background: rgba(124,77,255,0.12); color: #7c4dff; }
        .bd-function { background: rgba(0,161,214,0.12); color: #00a1d6; }
        .bd-duration { background: rgba(76,175,80,0.12); color: #4caf50; }
        .bd-once { background: rgba(255,152,0,0.15); color: #ff9800; }
        .shop-card button {
            border: none; border-radius: 30px; padding: 9px 0; cursor: pointer;
            background: var(--nav-btn-hover-bg); color: white; font-size: 0.95rem; font-weight: 600;
            transition: 0.2s;
        }
        .shop-card button:hover { filter: brightness(0.9); transform: scale(0.98); }
        .sc-buy-row { display: flex; align-items: center; gap: 8px; }
        .sc-qty {
            display: inline-flex; align-items: center; gap: 2px;
            background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 30px; padding: 2px 4px;
        }
        .sc-qty button {
            border: none; background: none; cursor: pointer; font-size: 1.1rem;
            width: 30px; height: 30px; line-height: 1; border-radius: 50%;
            color: var(--text-color); padding: 0;
        }
        .sc-qty button:hover { background: var(--count-bg); filter: none; transform: none; }
        .sc-qty span { min-width: 26px; text-align: center; font-weight: 700; color: var(--status-border); font-size: 0.95rem; }
        .sc-buy-btn { flex: 1; }
        .login-tip { text-align: center; padding: 50px 0; }
        .login-tip p { color: var(--count-text); margin-bottom: 20px; }
        .login-tip a { background: var(--nav-btn-hover-bg); color: white; border-radius: 30px; padding: 10px 30px; text-decoration: none; }
        .loading { text-align: center; color: var(--count-text); padding: 40px 0; }
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10000; }
        .custom-modal .modal-content { background: var(--card-bg); border-radius: 24px; padding: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .custom-modal .modal-content button { margin-top: 16px; padding: 6px 20px; border-radius: 30px; border: none; cursor: pointer; background: var(--nav-btn-hover-bg); color: white; }
    </style>
</head>

<script>
    if (typeof supabase === 'undefined' && typeof window.supabase !== 'undefined') { var supabase = window.supabase; }
    if (typeof supabase === 'undefined') {
        document.body.innerHTML = '<div style="color:red; padding:20px; text-align:center;">❌ 无法加载 Supabase 客户端</div>';
        throw new Error('Supabase not loaded');
    }
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getCurrentUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) return null;
        try { return JSON.parse(stored); } catch(e) { return null; }
    }

    function showMessage(title, msg) {
        return new Promise((resolve) => {
            const modal = document.getElementById('customMessageModal');
            const titleElem = document.getElementById('customMessageTitle');
            const textElem = document.getElementById('customMessageText');
            const closeBtn = document.getElementById('customMessageClose');
            titleElem.innerText = title;
            textElem.innerText = msg;
            modal.style.display = 'flex';
            const onClose = () => {
                modal.style.display = 'none';
                closeBtn.removeEventListener('click', onClose);
                resolve();
            };
            closeBtn.addEventListener('click', onClose, { once: true });
        });
    }

    function fmtPrice(n) {
        if (n >= 100000000) return (n / 100000000).toFixed(2).replace(/\.?0+$/, '') + '亿';
        if (n >= 10000) return (n / 10000).toFixed(2).replace(/\.?0+$/, '') + '万';
        return String(n);
    }

    async function loadShop() {
        const user = getCurrentUser();
        const body = document.getElementById('shopBody');
        if (!user) {
            body.innerHTML = `<div class="login-tip"><p>请先登录后再逛商店</p><a href="${uiHref('login.html?redirect=')}${encodeURIComponent(window.location.href)}">去登录</a></div>`;
            return;
        }
        // 余额
        const { data: prof } = await supabaseClient.from('profiles').select('nb_balance').eq('id', user.id).maybeSingle();
        if (prof) document.getElementById('balanceDisplay').innerText = prof.nb_balance;

        const { data: items, error } = await supabaseClient
            .from('shop_items')
            .select('key, name, icon, price, category, duration_days, stackable, auto_renew, max_hold, desc_text')
            .eq('enabled', true)
            .order('price', { ascending: true });
        if (error || !items || items.length === 0) {
            body.innerHTML = '<div class="loading">商品暂未上架（请确认 shop.sql 已执行）</div>';
            return;
        }
        const deco = items.filter(i => i.category === 'decoration');
        const func = items.filter(i => i.category === 'function');

        // 完整规则说明（弹窗展示；无则只显示 desc）
        const RULES = {
            checkin_fix: [
                '📝 补签卡使用规则：',
                '1. 使用后补回"最近漏签"的 1 天（只能补今天之前 1~5 天内的漏签）',
                '2. 每次补签消耗 1 张卡，同一日期不能重复补',
                '3. 连续签到按"真实签到"计算：补签日 + 之前连续的真实签到天数（补签只能接上断掉的连续，不能凭空堆天数）',
                '4. 补签不计入签到总次数、不计入签到热力图、不影响"签到之神"称号',
                '5. 每自然月最多补签 5 次；最多同时持有 5 张卡',
                '6. 补签不奖励 NB 币'
            ],
            lottery_extra: [
                '🎰 抽奖次数增加券使用规则：',
                '1. 使用后当日抽奖次数 +10（在背包点"⚡ 使用"生效）',
                '2. 与每日基础次数（默认10次）叠加，当天有效，隔天失效',
                '3. 多张可叠加：用 2 张 = 当日 +20 次'
            ],
            fee_discount: [
                '📉 股票手续费减免券使用规则：',
                '1. 买入/卖出时，在交易弹窗勾选"使用手续费减免券"',
                '2. 手续费从 5% 降至 2%',
                '3. 一次交易消耗 1 张，未勾选则保留'
            ],
            title_slot: [
                '🏅 称号展示位使用规则：',
                '1. 生效期间，主页额外展示 1 个称号（自动取"最高星级的未佩戴称号"）',
                '2. 自动续期：到期前余额充足自动扣费续期',
                '3. 仅 1 个展示位，重复购买会顺延到期时间'
            ],
            bio_extend: [
                '✏️ 个性签名扩展使用规则：',
                '1. 生效期间，主页简介字数上限从 100 字提升到 200 字',
                '2. 自动续期：到期前余额充足自动扣费续期'
            ],
            comment_color: [
                '💬 评论专属颜色券使用规则：',
                '1. 生效期间，你的评论文字显示自选颜色',
                '2. 在背包点"🎨 更换样式"可随时改色（支持任意颜色）',
                '3. 叠加购买 = 时长叠加（2张=14天）'
            ],
            nickname_color: [
                '📛 昵称变色卡使用规则：',
                '1. 生效期间，评论区你的名字显示颜色（红/金/🌈彩虹）',
                '2. 在背包点"🎨 更换样式"可随时更换',
                '3. 叠加购买 = 时长叠加（2张=14天）'
            ],
            chat_bubble: [
                '💬 私信气泡皮肤使用规则：',
                '1. 生效期间，私信聊天气泡显示颜色（蓝/粉/绿/🌈彩虹）',
                '2. 对方也能看到你的气泡颜色',
                '3. 在背包点"🎨 更换样式"可随时更换',
                '4. 叠加购买 = 时长叠加（2张=14天）'
            ],
            profile_skin: [
                '🎪 主页皮肤使用规则：',
                '1. 生效期间，主页解锁头图区',
                '2. 在个人中心主页可上传头图（支持图片/GIF，≤5MB）',
                '3. 自动续期：到期前余额充足自动扣费续期',
                '4. 叠加购买 = 时长叠加'
            ],
            particle_fx: [
                '🔮 主页粒子特效卡使用规则：',
                '1. 生效期间，主页有鼠标粒子特效：移动鼠标产生拖尾、点击产生爆发（手机触摸同样生效）',
                '2. 在背包点"🎨 更换样式"选择特效：🔥火焰 / ⚡闪电 / 🫧气泡 / ✨星光',
                '3. 自动续期：到期前余额充足自动扣费续期',
                '4. 叠加购买 = 时长叠加'
            ]
        };
        const RULE_KEYS = Object.keys(RULES);

        function cardHtml(i) {
            const cat = i.category === 'decoration'
                ? '<span class="sc-badge bd-decoration">🎨 装饰</span>'
                : '<span class="sc-badge bd-function">⚡ 功能</span>';
            const dur = i.duration_days
                ? `<span class="sc-badge bd-duration">${i.duration_days}天</span>`
                : '<span class="sc-badge bd-once">一次性</span>';
            const renew = i.auto_renew ? '<span class="sc-badge bd-duration">自动续期</span>' : '';
            const stack = i.stackable ? '<span class="sc-badge bd-duration">可叠加</span>' : '';
            const ruleBtn = RULES[i.key] ? `<a href="javascript:void(0)" data-rule="${i.key}" style="font-size:0.75rem; color:var(--status-border); text-decoration:underline; margin-top:2px; display:inline-block;">📖 查看完整规则</a>` : '';
            // 可叠加商品：显示数量选择器；不可叠加：直接购买按钮
            const buyRow = i.stackable
                ? `<div class="sc-buy-row">
                    <div class="sc-qty">
                        <button data-act="minus" data-key="${i.key}">−</button>
                        <span data-qty="${i.key}">1</span>
                        <button data-act="plus" data-key="${i.key}">+</button>
                    </div>
                    <button class="sc-buy-btn" data-key="${i.key}" data-name="${escapeHtml(i.name)}" data-price="${i.price}">🛒 购买</button>
                  </div>`
                : `<button class="sc-buy-btn" data-key="${i.key}" data-name="${escapeHtml(i.name)}" data-price="${i.price}">🛒 购买</button>`;
            return `<div class="shop-card">
                <div class="sc-icon">${i.icon}</div>
                <div class="sc-name">${escapeHtml(i.name)}</div>
                <div class="sc-desc">${cat} ${dur} ${renew} ${stack}
                    <div style="margin-top:6px;">${escapeHtml(i.desc_text)}</div></div>
                ${ruleBtn}
                <div class="sc-price" data-price-line="${i.key}">💰 ${fmtPrice(i.price)} NB币</div>
                ${buyRow}
            </div>`;
        }

        body.innerHTML =
            `<div class="section"><div class="section-title">🎨 装饰道具</div><div class="shop-grid">${deco.map(cardHtml).join('')}</div></div>` +
            `<div class="section"><div class="section-title">⚡ 功能道具</div><div class="shop-grid">${func.map(cardHtml).join('')}</div></div>`;

        // 规则弹窗
        body.querySelectorAll('[data-rule]').forEach(a => {
            a.onclick = (e) => {
                e.stopPropagation();
                const rules = RULES[a.dataset.rule] || [];
                showRulesModal(a.dataset.rule, rules);
            };
        });

        // 数量选择：+ / -
        body.querySelectorAll('[data-act]').forEach(btn => {
            btn.onclick = () => {
                const key = btn.dataset.key;
                const qtyEl = body.querySelector(`[data-qty="${key}"]`);
                const priceLine = body.querySelector(`[data-price-line="${key}"]`);
                const price = parseInt(body.querySelector(`[data-key="${key}"].sc-buy-btn`).dataset.price);
                let qty = parseInt(qtyEl.innerText) || 1;
                if (btn.dataset.act === 'plus') qty += 1;
                else qty = Math.max(1, qty - 1);
                qtyEl.innerText = qty;
                if (priceLine) priceLine.innerHTML = `💰 ${fmtPrice(price * qty)} NB币${qty > 1 ? `（${qty}件）` : ''}`;
            };
        });

        // 购买
        body.querySelectorAll('.sc-buy-btn').forEach(btn => {
            btn.onclick = async () => {
                const key = btn.dataset.key;
                const name = btn.dataset.name;
                const price = parseInt(btn.dataset.price);
                const qtyEl = body.querySelector(`[data-qty="${key}"]`);
                const qty = qtyEl ? (parseInt(qtyEl.innerText) || 1) : 1;
                const total = price * qty;
                const ok = await showConfirm(`购买「${name}」`, `确认花费 ${fmtPrice(total)} NB币购买「${name}」${qty > 1 ? ` ×${qty}` : ''}吗？`);
                if (!ok) return;
                // 逐个购买（叠加逻辑在 RPC 内处理）
                for (let k = 0; k < qty; k++) {
                    const { data, error } = await supabaseClient.rpc('buy_shop_item', { p_user_id: user.id, p_item_key: key });
                    if (error) {
                        await showMessage('购买失败', error.message);
                        break;
                    } else if (!data.success) {
                        await showMessage('购买失败', data.message);
                        break;
                    }
                }
                // 刷新余额
                const { data: prof2 } = await supabaseClient.from('profiles').select('nb_balance').eq('id', user.id).maybeSingle();
                if (prof2) document.getElementById('balanceDisplay').innerText = prof2.nb_balance;
                if (qtyEl) qtyEl.innerText = '1';
                const priceLine = body.querySelector(`[data-price-line="${key}"]`);
                if (priceLine) priceLine.innerHTML = `💰 ${fmtPrice(price)} NB币`;
            };
        });
    }

    function showRulesModal(itemKey, rules) {
        const modal = document.createElement('div');
        modal.className = 'custom-modal';
        modal.style.display = 'flex';
        const lines = rules.map(r => `<p style="text-align:left; font-size:0.9rem; line-height:1.8; color:var(--text-color); margin:6px 0;">${escapeHtml(r)}</p>`).join('');
        modal.innerHTML = `
            <div class="modal-content" style="max-width:440px; text-align:left;">
                <h3 style="text-align:center;">📖 ${escapeHtml((RULES[itemKey] && RULES[itemKey][0]) || '使用规则')}</h3>
                <div style="max-height:60vh; overflow-y:auto;">${lines.slice(1).join('')}</div>
                <div style="text-align:center;"><button id="rulesClose" style="background:var(--nav-btn-hover-bg);">知道了</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#rulesClose').onclick = () => modal.remove();
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    }

    function showConfirm(title, msg) {
        return new Promise((resolve) => {
            const modal = document.createElement('div');
            modal.className = 'custom-modal';
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>${escapeHtml(title)}</h3>
                    <p style="margin: 15px 0;">${escapeHtml(msg)}</p>
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button id="confirmOk" style="background:var(--nav-btn-hover-bg);">确定</button>
                        <button id="confirmCancel" style="background:#6c757d;">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            const cleanup = () => { modal.remove(); };
            document.getElementById('confirmOk').onclick = () => { cleanup(); resolve(true); };
            document.getElementById('confirmCancel').onclick = () => { cleanup(); resolve(false); };
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    loadShop();
</script>
</body>
</html>
