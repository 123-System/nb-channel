<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NB银行 - NB频道</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <style>
        body { padding: 40px 20px; background: var(--bg-color); }
        .bank-container {
            max-width: 860px; margin: 0 auto;
            background: var(--card-bg); border-radius: 32px; padding: 30px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin: 0 0 6px; color: var(--status-border); }
        .page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .page-head h1 { margin: 0; flex: 1; }
        .balance-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--count-bg); border: 1px solid var(--card-border);
            border-radius: 30px; padding: 6px 16px; font-size: 0.9rem;
            color: var(--text-color); font-weight: 600; white-space: nowrap;
        }
        .balance-chip .bc-num { color: #ff9800; font-weight: 800; }
        .sub-title { text-align: center; color: var(--count-text); font-size: 0.9rem; margin-bottom: 22px; }
        .top-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
        .top-actions a, .top-actions button {
            background: var(--nav-btn-bg); color: var(--nav-btn-text);
            border: 1px solid var(--card-border); border-radius: 30px;
            padding: 8px 18px; font-size: 0.9rem; cursor: pointer; text-decoration: none;
        }
        .top-actions button:hover { background: var(--nav-btn-hover-bg); color: white; }
        /* 总览 */
        .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .ov-card { background: var(--count-bg); border-radius: 20px; padding: 14px 10px; text-align: center; }
        .ov-card .num { font-size: 1.25rem; font-weight: 700; color: var(--status-border); word-break: break-all; }
        .ov-card .label { font-size: 0.78rem; color: var(--count-text); margin-top: 4px; }
        .ov-card .tip { font-size: 0.68rem; color: var(--count-text); margin-top: 2px; }
        /* 分区 */
        .section { margin-bottom: 26px; }
        .section-title { font-size: 1.05rem; font-weight: 700; color: var(--status-border); margin-bottom: 12px; }
        .bank-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .bank-row input[type=number], .bank-row select {
            padding: 9px 14px; border-radius: 14px; border: 1px solid var(--card-border);
            background: var(--bg-color); color: var(--text-color); font-size: 0.95rem;
            min-width: 140px;
        }
        .bank-row button {
            border: none; border-radius: 14px; padding: 9px 20px; cursor: pointer;
            background: var(--nav-btn-hover-bg); color: white; font-size: 0.9rem;
        }
        .bank-row button.gray { background: var(--nav-btn-bg); color: var(--nav-btn-text); }
        .info-line { font-size: 0.8rem; color: var(--count-text); margin-bottom: 6px; line-height: 1.7; }
        .rate-tag { display: inline-block; background: rgba(76,175,80,0.12); color: #4caf50; border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; font-weight: 600; }
        .rate-warn { background: rgba(255,152,0,0.15); color: #ff9800; }
        /* 信誉分 */
        .credit-box { background: var(--count-bg); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .credit-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .credit-score { font-size: 2rem; font-weight: 800; color: var(--status-border); }
        .credit-level { font-size: 0.95rem; font-weight: 700; padding: 3px 14px; border-radius: 20px; }
        .lv-red { background: rgba(231,76,60,0.15); color: #e74c3c; }
        .lv-orange { background: rgba(255,152,0,0.15); color: #ff9800; }
        .lv-yellow { background: rgba(255,193,7,0.18); color: #f5a623; }
        .lv-green { background: rgba(76,175,80,0.15); color: #4caf50; }
        .credit-bar { height: 10px; background: var(--card-border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .credit-bar-inner { height: 100%; background: linear-gradient(90deg, #e74c3c, #ff9800, #f5a623, #4caf50); border-radius: 10px; transition: width 0.5s; }
        .credit-rules { font-size: 0.75rem; color: var(--count-text); line-height: 1.8; margin-top: 10px; }
        /* 日志 */
        .log-list { max-height: 300px; overflow-y: auto; font-size: 0.8rem; }
        .log-item { display: flex; justify-content: space-between; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed var(--card-border); }
        .log-item .ld { color: var(--count-text); }
        .log-item .la { font-weight: 600; color: var(--status-border); }
        .login-tip { text-align: center; padding: 50px 0; }
        .login-tip p { color: var(--count-text); margin-bottom: 20px; }
        .login-tip a { background: var(--nav-btn-hover-bg); color: white; border-radius: 30px; padding: 10px 30px; text-decoration: none; }
        .loading { text-align: center; color: var(--count-text); padding: 40px 0; }
        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #ffd700; color: #333; border-radius: 30px; padding: 12px 24px;
            font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 9999;
            max-width: 90vw; text-align: center; display: none;
        }
    </style>
</head>
<body>
<script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})();</script>
<div class="bank-container">
    <div class="page-head">
        <span class="balance-chip">💰 NB币: <span class="bc-num" id="balanceDisplay">--</span></span>
        <h1>🏦 NB银行</h1>
        <span style="width:120px;"></span>
    </div>
    <p class="sub-title">存钱有利息 · 贷款可救急 · 信誉分能决定信用贷额度</p>

    <div class="top-actions">
        <a href="index.html">🏠 返回首页</a>
        <button id="refreshBtn">🔄 刷新</button>
    </div>

    <div id="content"><div class="loading">加载中...</div></div>
</div>

<div class="toast" id="toast"></div>

<div style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--count-text); line-height:2.1;">
    © 2026 NB频道 · 虚拟公司 · <a href="https://nb-channel.top" target="_blank" rel="noopener noreferrer">nb-channel.top（导航页）</a> · <a href="https://github.nb-channel.top" target="_blank" rel="noopener noreferrer">github站</a> · <a href="https://cloudflare.nb-channel.top" target="_blank" rel="noopener noreferrer">cloudflare站</a> · <a href="https://pythonanywhere.nb-channel.top" target="_blank" rel="noopener noreferrer">pythonanywhere站</a><br>
    如有任何问题或建议，请联系：<a href="mailto:nbchannel@163.com">nbchannel@163.com</a> 或 <a href="mailto:NBchannel@163.com">NBchannel@163.com</a><br>
    制作：<a href="https://space.bilibili.com/3493259582114264" target="_blank" rel="noopener noreferrer">NB搞事局（原NB实验室-作死）</a><br>
    托管：<a href="https://github.com/" target="_blank" rel="noopener noreferrer">Github</a> · <a href="https://www.cloudflare-cn.com/developer-platform/products/pages/" target="_blank" rel="noopener noreferrer">Cloudflare</a> · <a href="https://www.pythonanywhere.com/" target="_blank" rel="noopener noreferrer">PythonAnywhere</a> <br>     资源致谢：<a href="https://www.jsdelivr.com/" target="_blank" rel="noopener noreferrer">jsDelivr</a> · <a href="https://supabase.com/" target="_blank" rel="noopener noreferrer">Supabase</a>
</div>
<div class="fixed-buttons">
    <button class="theme-toggle-fixed" id="themeToggleFixed" onclick="toggleTheme()">🌙</button>
    <div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>
</div>

<script>
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) return null;
        try { return JSON.parse(stored); } catch (e) { return null; }
    }
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
    function fmtBig(n) {
        n = Number(n) || 0;
        if (n >= 100000000) return (n / 100000000).toFixed(2).replace(/\.?0+$/, '') + '亿';
        if (n >= 10000) return (n / 10000).toFixed(2).replace(/\.?0+$/, '') + '万';
        return String(n);
    }
    function fmtTime(ts) {
        try { return new Date(ts).toLocaleString('zh-CN', { hour12: false }); } catch (e) { return ''; }
    }
    let toastTimer = null;
    function showToast(text) {
        const t = document.getElementById('toast');
        t.innerHTML = text;
        t.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
    }
    async function callRpc(name, params) {
        const user = getUser();
        if (!user) throw new Error('请先登录');
        const { data, error } = await supabaseClient.rpc(name, { p_user_id: user.id, ...params });
        if (error) throw error;
        if (!data || !data.success) throw new Error((data && data.message) || '操作失败');
        return data;
    }
    function creditLevel(score) {
        if (score < 300) return { name: '失信', cls: 'lv-red', limit: 0 };
        if (score < 600) return { name: '普通', cls: 'lv-orange', limit: score * 500 };
        if (score < 800) return { name: '良好', cls: 'lv-yellow', limit: score * 1000 };
        return { name: '优秀', cls: 'lv-green', limit: score * 1500 };
    }

    async function loadBalance() {
        const user = getUser();
        const el = document.getElementById('balanceDisplay');
        if (!user || !el) return;
        try {
            const { data } = await supabaseClient.from('profiles').select('nb_balance').eq('id', user.id).single();
            if (data) el.innerText = fmtBig(data.nb_balance);
        } catch (e) { /* 忽略 */ }
    }

    async function loadBank() {
        const content = document.getElementById('content');
        const user = getUser();
        if (!user) {
            content.innerHTML = `<div class="login-tip"><p>🔒 请先登录后使用 NB银行</p><a href="login.html">去登录</a></div>`;
            return;
        }
        content.innerHTML = '<div class="loading">加载中...</div>';
        try {
            const acc = await callRpc('get_bank_account', {});
            const logsRes = await supabaseClient.rpc('get_bank_logs', { p_user_id: user.id, p_limit: 30 });
            const logs = logsRes.data || [];
            const lv = creditLevel(acc.credit_score);
            // 冻结期：显示冻结金额，新存入的部分可自由取
            const frozenTip = acc.frozen
                ? ` <div class="info-line" style="color:#e74c3c;">🔒 有抵押贷款未还清：冻结 <b>${fmtBig(acc.frozen_amount)}</b> NB币，冻结后新存入的部分（${fmtBig(acc.free_deposit)} NB币）可自由取出；还清贷款后全部解冻。</div>`
                : '';
            const frozenFixedBtn = acc.frozen ? ' disabled style="opacity:0.45;"' : '';
            const frozenHint = acc.frozen
                ? `<span class="info-line" style="margin:0; color:#e74c3c;">🔒 冻结 ${fmtBig(acc.frozen_amount)} NB币 · 可自由取出 ${fmtBig(acc.free_deposit)} NB币</span>`
                : '<span class="info-line" style="margin:0;">今日存入上限 500万/天</span>';

            let html = `
                <div class="overview">
                    <div class="ov-card"><div class="num">${fmtBig(acc.deposit)}</div><div class="label">活期存款</div><div class="tip">日利率 0.05%</div></div>
                    <div class="ov-card"><div class="num">${fmtBig(acc.fixed7)}</div><div class="label">定期7天</div><div class="tip">日利率 0.1%${acc.fixed7_until ? ' · ' + fmtTime(acc.fixed7_until).slice(5,16) + '到期' : ''}</div></div>
                    <div class="ov-card"><div class="num">${fmtBig(acc.fixed30)}</div><div class="label">定期30天</div><div class="tip">日利率 0.2%${acc.fixed30_until ? ' · ' + fmtTime(acc.fixed30_until).slice(5,16) + '到期' : ''}</div></div>
                    <div class="ov-card"><div class="num">${fmtBig(acc.loan_principal)}</div><div class="label">抵押贷款</div><div class="tip">日利率 0.2%</div></div>
                    <div class="ov-card"><div class="num">${fmtBig(acc.loan_credit)}</div><div class="label">信用贷款</div><div class="tip">日利率 ${acc.credit_score >= 800 ? '0.27%' : '0.3%'}</div></div>
                </div>
                ${frozenTip}

                <div class="section">
                    <div class="section-title">💰 存款</div>
                    <div class="bank-row">
                        <input type="number" id="depAmt" min="1" placeholder="金额" style="min-width:120px;">
                        <button onclick="doDeposit()">存入活期</button>
                        <button class="gray" onclick="doWithdraw()">取出活期</button>
                        ${frozenHint}
                    </div>
                    <div class="bank-row">
                        <input type="number" id="fixedAmt" min="1" placeholder="定期金额">
                        <select id="fixedDays">
                            <option value="7">定期 7 天（0.1%/天）</option>
                            <option value="30">定期 30 天（0.2%/天）</option>
                        </select>
                        <button onclick="doFixedDeposit()">存定期</button>
                        <button class="gray" onclick="doFixedWithdraw()"${frozenFixedBtn}>取出定期</button>
                    </div>
                    <div class="info-line">📅 定期到期自动转入活期并结算利息；提前支取按活期利率算已存天数。</div>
                </div>

                <div class="section">
                    <div class="section-title">🏦 贷款</div>
                    <div class="info-line">
                        抵押贷额度：<span class="rate-tag">${fmtBig(acc.collateral_limit)} NB币</span>（存款×80%，日利率 0.2%）
                        &nbsp;信用贷额度：<span class="rate-tag">${fmtBig(lv.limit)} NB币</span>（信誉分×${lv.limit ? (lv.limit / acc.credit_score) : 0}，日利率 ${acc.credit_score >= 800 ? '0.27%' : '0.3%'}）
                    </div>
                    <div class="bank-row">
                        <input type="number" id="loanAmt" min="1" placeholder="贷款金额">
                        <select id="loanDays">
                            <option value="7">7 天</option>
                            <option value="30">30 天</option>
                        </select>
                        <button onclick="doLoan('loan')">🏦 抵押贷</button>
                        <button onclick="doLoan('credit')">🤝 信用贷</button>
                        <button class="gray" onclick="doRepay('loan')">还抵押贷</button>
                        <button class="gray" onclick="doRepay('credit')">还信用贷</button>
                    </div>
                    <div class="info-line">💡 到期自动从余额扣本息；余额不足则逾期：每天罚息 0.1% + 信誉 -15，抵押贷期间存款冻结。提前还利息按实际天数算。</div>
                </div>

                <div class="section">
                    <div class="section-title">⭐ 信誉分</div>
                    <div class="credit-box">
                        <div class="credit-top">
                            <div><span class="credit-score">${acc.credit_score}</span><span style="color:var(--count-text); font-size:0.85rem;"> / 1000</span></div>
                            <span class="credit-level ${lv.cls}">${lv.name}</span>
                        </div>
                        <div class="credit-bar"><div class="credit-bar-inner" style="width:${Math.min(acc.credit_score, 1000) / 10}%;"></div></div>
                        <div class="credit-rules">
                            加减分规则：按时还款 +5/次 · 逾期 -15/天 · 新成就 +3/个 · 连续签到7天 +2/次 · 发布评论 +0.5/条（每日上限+2）· 被举报核实 -10/次 · 封禁清零<br>
                            等级：失信 &lt;300（不能信用贷）· 普通 300~599（额度=信誉分×500）· 良好 600~799（×1000）· 优秀 800+（×1500 且利率9折）
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">📜 最近记录</div>
                    <div class="log-list">
                        ${logs.length ? logs.map(l => `
                            <div class="log-item">
                                <span class="ld">${fmtTime(l.created_at)} · ${escapeHtml(l.detail)}</span>
                                <span class="la">${l.amount > 0 ? '+' : ''}${fmtBig(l.amount)}</span>
                            </div>`).join('') : '<div class="info-line">暂无记录</div>'}
                    </div>
                </div>`;
            content.innerHTML = html;
            loadBalance();
        } catch (err) {
            content.innerHTML = `<div class="loading">加载失败：${escapeHtml(err.message)}</div>`;
        }
    }

    async function doDeposit() {
        const amt = parseInt(document.getElementById('depAmt').value);
        if (!amt || amt <= 0) { alert('请输入金额'); return; }
        try { const r = await callRpc('bank_deposit', { p_amount: amt }); showToast('✅ ' + r.message); loadBank(); loadBalance(); }
        catch (e) { alert(e.message); }
    }
    async function doWithdraw() {
        const amt = parseInt(document.getElementById('depAmt').value);
        if (!amt || amt <= 0) { alert('请输入金额'); return; }
        try { const r = await callRpc('bank_withdraw', { p_amount: amt }); showToast('✅ ' + r.message); loadBank(); loadBalance(); }
        catch (e) { alert(e.message); }
    }
    async function doFixedDeposit() {
        const amt = parseInt(document.getElementById('fixedAmt').value);
        const days = parseInt(document.getElementById('fixedDays').value);
        if (!amt || amt <= 0) { alert('请输入金额'); return; }
        try { const r = await callRpc('bank_fixed_deposit', { p_amount: amt, p_days: days }); showToast('✅ ' + r.message); loadBank(); loadBalance(); }
        catch (e) { alert(e.message); }
    }
    async function doFixedWithdraw() {
        const days = parseInt(document.getElementById('fixedDays').value);
        try { const r = await callRpc('bank_fixed_withdraw', { p_days: days }); showToast('✅ ' + r.message); loadBank(); loadBalance(); }
        catch (e) { alert(e.message); }
    }
    async function doLoan(type) {
        const amt = parseInt(document.getElementById('loanAmt').value);
        const days = parseInt(document.getElementById('loanDays').value);
        if (!amt || amt <= 0) { alert('请输入金额'); return; }
        const name = type === 'loan' ? '抵押贷' : '信用贷';
        if (!confirm(`确认申请${name} ${amt} NB币（${days}天）？`)) return;
        try {
            const r = type === 'loan'
                ? await callRpc('bank_loan', { p_amount: amt, p_days: days })
                : await callRpc('bank_credit_loan', { p_amount: amt, p_days: days });
            showToast('✅ ' + r.message); loadBank(); loadBalance();
        } catch (e) { alert(e.message); }
    }
    async function doRepay(type) {
        const name = type === 'loan' ? '抵押贷' : '信用贷';
        if (!confirm(`确认还清${name}？将按实际借款天数结算利息。`)) return;
        try {
            const r = type === 'loan'
                ? await callRpc('bank_repay', {})
                : await callRpc('bank_repay_credit', {});
            showToast('✅ ' + r.message); loadBank(); loadBalance();
        } catch (e) { alert(e.message); }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadBank);
    loadBank();
</script>
</body>
</html>
