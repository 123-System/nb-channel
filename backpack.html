<script>
    if (typeof supabase === 'undefined' && typeof window.supabase !== 'undefined') { var supabase = window.supabase; }
    if (typeof supabase === 'undefined') {
        document.body.innerHTML = '<div style="color:red; padding:20px; text-align:center;">❌ 无法加载 Supabase 客户端</div>';
        throw new Error('Supabase not loaded');
    }
    const SUPABASE_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getCurrentUser() {
        const stored = localStorage.getItem('nb_user');
        if (!stored) return null;
        try { return JSON.parse(stored); } catch(e) { return null; }
    }

    function showMessage(title, msg) {
        return new Promise((resolve) => {
            const modal = document.getElementById('customMessageModal');
            const titleElem = document.getElementById('customMessageTitle');
            const textElem = document.getElementById('customMessageText');
            const closeBtn = document.getElementById('customMessageClose');
            titleElem.innerText = title;
            textElem.innerText = msg;
            modal.style.display = 'flex';
            const onClose = () => {
                modal.style.display = 'none';
                closeBtn.removeEventListener('click', onClose);
                resolve();
            };
            closeBtn.addEventListener('click', onClose, { once: true });
        });
    }

    function fmtTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function remainingDays(expiresAt) {
        if (!expiresAt) return null;
        return Math.max(0, Math.ceil((new Date(expiresAt) - new Date()) / 86400000));
    }

    async function loadBackpack() {
        const user = getCurrentUser();
        const body = document.getElementById('bpBody');
        if (!user) {
            body.innerHTML = `<div class="login-tip"><p>请先登录</p><a href="${uiHref('login.html?redirect=')}${encodeURIComponent(window.location.href)}">去登录</a></div>`;
            return;
        }
        const { data, error } = await supabaseClient.rpc('get_my_items', { p_user_id: user.id });
        if (error || !data || !data.success) {
            body.innerHTML = '<div class="no-data">加载失败（请确认 shop.sql 已执行）</div>';
            return;
        }
        const items = data.items || [];
        if (items.length === 0) {
            body.innerHTML = '<div class="no-data">背包空空如也，<a href="shop.html" style="color:var(--status-border);">去商店逛逛 →</a></div>';
            return;
        }

        // ===== 同种道具合并成一张卡片（按 item_key 分组） =====
        // active(生效/待使用) 合并显示 ×N；已使用/已过期各自合并显示 ×N
        const groups = {};   // item_key -> { info, active: [], used: [], expired: [] }
        for (const i of items) {
            if (!groups[i.item_key]) groups[i.item_key] = { info: i, active: [], used: [], expired: [] };
            if (i.used) groups[i.item_key].used.push(i);
            else if (i.expires_at && !i.active) groups[i.item_key].expired.push(i);
            else groups[i.item_key].active.push(i);
        }

        function cardHtml(group, list) {
            if (list.length === 0) return '';
            const i = list[0];
            const count = list.length;
            let status = '';
            let statusCls = '';
            let actions = '';
            const isUsed = list.every(x => x.used);
            const isExpired = !isUsed && list.every(x => !x.active && x.expires_at);
            if (isUsed) {
                status = `已使用 ×${count}`;
                statusCls = 'st-used';
            } else if (isExpired) {
                status = `已过期 ×${count}`;
                statusCls = 'st-expired';
            } else {
                const firstActive = list.find(x => x.active);
                if (firstActive) {
                    if (firstActive.expires_at) {
                        status = `生效中 · 剩余 ${remainingDays(firstActive.expires_at)} 天`;
                        statusCls = 'st-active';
                    } else {
                        status = `待使用 ×${count}`;
                        statusCls = 'st-active';
                    }
                }
                // 改色类道具（选一条生效中的）
                if (['comment_color', 'nickname_color', 'chat_bubble', 'particle_fx'].includes(i.item_key)) {
                    const activeOne = list.find(x => x.active);
                    if (activeOne) actions += `<button data-act="color" data-id="${activeOne.id}" data-key="${i.item_key}">🎨 更换样式</button>`;
                }
                // 一次性道具使用（未使用的）
                if (i.duration_days === null && !isUsed && i.item_key !== 'checkin_fix') {
                    const activeOne = list.find(x => x.active);
                    if (activeOne) actions += `<button data-act="use" data-id="${activeOne.id}" data-key="${i.item_key}" data-name="${escapeHtml(i.name)}">⚡ 使用</button>`;
                }
                if (i.item_key === 'checkin_fix' && !isUsed) {
                    const activeOne = list.find(x => x.active);
                    if (activeOne) actions += `<button data-act="checkin" data-id="${activeOne.id}">📝 去补签</button>`;
                }
                // 出售（未使用未过期的才能卖）
                const sellable = list.filter(x => x.active);
                if (sellable.length > 0) {
                    actions += `<button data-act="sell" data-key="${i.item_key}" data-name="${escapeHtml(i.name)}" class="gray">💰 出售</button>`;
                }
            }
            const meta = i.expires_at
                ? `到期：${fmtTime(i.expires_at)}${count > 1 ? `（最早）` : ''}`
                : '永久有效（一次性道具）';
            return `<div class="bp-card" data-id="${i.id}">
                <span class="bc-count">×${count}</span>
                <div class="bc-icon">${i.icon || '📦'}</div>
                <div class="bc-name">${escapeHtml(i.name)}</div>
                <div class="bc-meta">${meta}</div>
                <div class="bc-status ${statusCls}">${status}</div>
                ${actions ? `<div class="bc-actions">${actions}</div>` : ''}
            </div>`;
        }

        let html = '';
        const activeCards = Object.keys(groups).map(k => cardHtml(groups[k], groups[k].active)).filter(Boolean).join('');
        const usedCards = Object.keys(groups).map(k => cardHtml(groups[k], groups[k].used)).filter(Boolean).join('');
        const expiredCards = Object.keys(groups).map(k => cardHtml(groups[k], groups[k].expired)).filter(Boolean).join('');
        if (activeCards) html += `<div class="section-title" style="margin-top:8px;">🟢 生效中 / 待使用</div><div class="bp-grid">${activeCards}</div>`;
        if (usedCards) html += `<div class="section-title" style="margin-top:20px;">⚪ 已使用</div><div class="bp-grid">${usedCards}</div>`;
        if (expiredCards) html += `<div class="section-title" style="margin-top:20px;">🔴 已过期</div><div class="bp-grid">${expiredCards}</div>`;
        body.innerHTML = html;

        // 事件
        body.querySelectorAll('[data-act]').forEach(btn => {
            btn.onclick = async () => {
                const act = btn.dataset.act;
                const id = btn.dataset.id;
                if (act === 'use') {
                    const { data, error } = await supabaseClient.rpc('use_shop_item', { p_user_id: user.id, p_item_id: parseInt(id) });
                    await showMessage(error ? '使用失败' : (data && data.success ? '✅ 已使用' : '提示'),
                        error ? error.message : (data && data.message) || '');
                    loadBackpack();
                } else if (act === 'color') {
                    openColorModal(btn.dataset.key, parseInt(id));
                } else if (act === 'checkin') {
                    await showMessage('提示', '补签功能将在签到页面开放');
                } else if (act === 'sell') {
                    openSellModal(btn.dataset.key, btn.dataset.name);
                }
            };
        });
    }

    // ===== 出售弹窗（同种道具数量选择） =====
    async function openSellModal(itemKey, itemName) {
        const user = getCurrentUser();
        const { data, error } = await supabaseClient.rpc('get_my_items', { p_user_id: user.id });
        if (error || !data || !data.success) return;
        // 可卖数量 + 单价80%
        const sellable = (data.items || []).filter(i => i.item_key === itemKey && i.active);
        const count = sellable.length;
        if (count === 0) { await showMessage('提示', '没有可出售的道具'); return; }
        // 查购买价
        const { data: shopInfo } = await supabaseClient.from('shop_items').select('price').eq('key', itemKey).maybeSingle();
        const unit = shopInfo ? Math.floor(shopInfo.price * 0.8) : 0;

        const modal = document.createElement('div');
        modal.className = 'custom-modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>💰 出售「${escapeHtml(itemName)}」</h3>
                <p style="margin: 12px 0; color:var(--count-text);">持有 ${count} 个 · 单价回收 ${unit} NB币（购买价80%）</p>
                <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin: 12px 0;">
                    <button id="sellMinus" style="background:var(--nav-btn-bg); color:var(--nav-btn-text); border:1px solid var(--card-border); border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:1.1rem;">−</button>
                    <span id="sellQty" style="font-size:1.4rem; font-weight:800; color:var(--status-border); min-width:40px; text-align:center;">1</span>
                    <button id="sellPlus" style="background:var(--nav-btn-bg); color:var(--nav-btn-text); border:1px solid var(--card-border); border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:1.1rem;">+</button>
                </div>
                <p style="color:var(--count-text); font-size:0.9rem;">预计回收：<span id="sellTotal" style="color:#ff9800; font-weight:800;">${unit} NB币</span></p>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button id="sellOk" style="background:var(--nav-btn-hover-bg);">确认出售</button>
                    <button id="sellCancel" style="background:#6c757d;">取消</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        let qty = 1;
        const qtyEl = modal.querySelector('#sellQty');
        const totalEl = modal.querySelector('#sellTotal');
        const update = () => {
            qtyEl.innerText = qty;
            totalEl.innerText = (unit * qty) + ' NB币';
        };
        modal.querySelector('#sellMinus').onclick = () => { qty = Math.max(1, qty - 1); update(); };
        modal.querySelector('#sellPlus').onclick = () => { qty = Math.min(count, qty + 1); update(); };
        modal.querySelector('#sellCancel').onclick = () => modal.remove();
        modal.querySelector('#sellOk').onclick = async () => {
            modal.remove();
            const res = await supabaseClient.rpc('sell_shop_item', { p_user_id: user.id, p_item_key: itemKey, p_quantity: qty });
            const msg = res.error ? res.error.message : (res.data && res.data.message) || '';
            await showMessage(res.error || !res.data || !res.data.success ? '出售失败' : '✅ 已出售', msg);
            loadBackpack();
        };
    }

    // ===== 改色弹窗 =====
    const COLOR_PRESETS = {
        comment_color: { label: '评论文字颜色', options: ['#e74c3c', '#ff9800', '#f5a623', '#4caf50', '#00a1d6', '#7c4dff', '#ff6b9d', '#795548'], free: true },
        nickname_color: { label: '昵称颜色', options: ['#e74c3c', '#f5a623', 'rainbow'], free: false },
        chat_bubble: { label: '气泡颜色', options: ['#00a1d6', '#ff6b9d', '#4caf50', 'rainbow'], free: false },
        particle_fx: { label: '粒子特效', options: ['fire', 'lightning', 'bubble', 'star'], free: false }
    };

    function openColorModal(itemKey, itemId) {
        const cfg = COLOR_PRESETS[itemKey];
        if (!cfg) return;
        const modal = document.createElement('div');
        modal.className = 'custom-modal';
        modal.style.display = 'flex';
        let optionsHtml = '';
        if (cfg.free) {
            optionsHtml = `<div class="color-options">
                ${cfg.options.map(c => `<div class="color-opt" data-val="${c}" style="background:${c};"></div>`).join('')}
                <input type="color" id="freeColor" value="#00a1d6">
            </div>`;
        } else {
            const labels = {
                '#e74c3c': '❤️ 红', '#ff9800': '🧡 橙', '#f5a623': '💛 金', '#4caf50': '💚 绿',
                '#00a1d6': '💙 蓝', '#7c4dff': '💜 紫', '#ff6b9d': '💗 粉', '#795548': '🤎 棕',
                rainbow: '🌈 彩虹',
                fire: '🔥 火焰', lightning: '⚡ 闪电', bubble: '🫧 气泡', star: '✨ 星光',
                default: '🌙 默认', aurora: '🌌 极光', night: '🌃 夜晚', cherry: '🌸 樱花'
            };
            optionsHtml = `<div class="color-options">
                ${cfg.options.map(c => `<div class="color-opt" data-val="${c}" style="background:${c === 'rainbow' || c === 'fire' || c === 'lightning' || c === 'bubble' || c === 'star' || c === 'aurora' || c === 'night' || c === 'cherry' ? 'linear-gradient(135deg,#ff6b9d,#7c4dff)' : c};">${labels[c] || ''}</div>`).join('')}
            </div>`;
        }
        modal.innerHTML = `
            <div class="modal-content">
                <h3>🎨 ${cfg.label}</h3>
                ${optionsHtml}
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button id="colorOk" style="background:var(--nav-btn-hover-bg);">确定</button>
                    <button id="colorCancel" style="background:#6c757d;">取消</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        let selected = null;
        modal.querySelectorAll('.color-opt').forEach(opt => {
            opt.onclick = () => {
                modal.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selected = opt.dataset.val;
            };
        });
        modal.querySelector('#colorOk').onclick = async () => {
            let val = selected;
            if (cfg.free) {
                const freeInput = modal.querySelector('#freeColor');
                if (freeInput && freeInput.value) val = freeInput.value;
            }
            if (!val) { await showMessage('提示', '请先选择一个样式'); return; }
            modal.remove();
            const { data, error } = await supabaseClient.rpc('set_item_settings', {
                p_user_id: getCurrentUser().id, p_item_id: itemId, p_settings: { value: val }
            });
            await showMessage(error || !data || !data.success ? '保存失败' : '✅ 已保存', (error && error.message) || (data && data.message) || '');
            loadBackpack();
        };
        modal.querySelector('#colorCancel').onclick = () => modal.remove();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    loadBackpack();
</script>
</body>
</html>
